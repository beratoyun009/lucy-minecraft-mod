name: Android FCL compatibility build

on:
  workflow_dispatch:
  push:
    branches:
      - android-fcl

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build ARM64 Android compatibility shims
        shell: bash
        run: |
          set -euo pipefail
          CLANG="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          test -x "$CLANG"
          OUT="src/client/resources/oasis-natives/android-aarch64"
          mkdir -p "$OUT"
          for LIB in             libdbus-1.so.3             libX11.so.6             libXfixes.so.3             libXrandr.so.2             libXcomposite.so.1             libudev.so.1             libpulse.so.0
          do
            "$CLANG" -shared -fPIC -nostdlib               android-fcl/native/desktop_service_stubs.c               -Wl,--version-script=android-fcl/native/stubs.map               -Wl,-soname,"$LIB"               -o "$OUT/$LIB"
          done
          file "$OUT"/*.so*

      - name: Build Fabric mod
        run: ./gradlew build --stacktrace

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: lucy-android-fcl
          path: build/libs/*.jar
          if-no-files-found: error
