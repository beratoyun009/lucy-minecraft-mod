name: Android FCL native WebRTC build

on:
  workflow_dispatch:
  push:
    branches:
      - android-fcl
    paths:
      - ".github/workflows/android-fcl.yml"
      - "android-fcl/webrtc-java-android.patch"
      - "src/**"
      - "build.gradle"
      - "gradle.properties"

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out mod source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake curl git maven ninja-build python3 unzip
          test -d "${ANDROID_NDK_LATEST_HOME}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "${GITHUB_ENV}"

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-webrtc-java-0.14.0-${{ runner.os }}
          restore-keys: |
            maven-webrtc-java-0.14.0-

      - name: Restore synchronized WebRTC checkout
        id: webrtc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/webrtc-checkout
          key: webrtc-src-7204-android-arm64-v6
          restore-keys: |
            webrtc-src-7204-android-arm64-v5
            webrtc-src-7204-android-arm64-v4
            webrtc-src-7204-android-arm64-v3
            webrtc-src-7204-android-arm64-v2

      - name: Check out webrtc-java 0.14.0
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/devopvoid/webrtc-java.git "${RUNNER_TEMP}/webrtc-java"
          cd "${RUNNER_TEMP}/webrtc-java"
          git checkout d6642ec41c77e3d9ff5feb963aeafb196743716e
          git apply "${GITHUB_WORKSPACE}/android-fcl/webrtc-java-android.patch"
          git diff --check
          git status --short

      - name: Build Android ARM64 WebRTC JNI
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/webrtc-java"
          mvn -B -pl webrtc-jni -am package \
            -DskipTests \
            -Pandroid-aarch64 \
            -Dplatform.classifier=linux-aarch64 \
            -Dplatform.module=webrtc.linux.aarch64 \
            -Dcmake.toolchain.file=toolchain/aarch64-android-clang.cmake \
            -Dwebrtc.src.dir="${RUNNER_TEMP}/webrtc-checkout" \
            -Dwebrtc.install.dir="${RUNNER_TEMP}/webrtc-install"

      - name: Save synchronized WebRTC checkout
        if: always() && steps.webrtc-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/webrtc-checkout
          key: webrtc-src-7204-android-arm64-v6

      - name: Report WebRTC checkout size
        if: always()
        shell: bash
        run: du -sh "${RUNNER_TEMP}/webrtc-checkout" || true

      - name: Verify Android native dependencies
        shell: bash
        run: |
          set -euo pipefail
          SO="$(find "${RUNNER_TEMP}/webrtc-java/webrtc-jni/target/lib" -name 'libwebrtc-java-linux-aarch64.so' -print -quit)"
          test -n "$SO"
          READELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h "$SO"
          "$READELF" -d "$SO" | tee "${GITHUB_WORKSPACE}/android-native-dependencies.txt"
          if grep -Eq 'libstdc\+\+|libc\.so\.6|ld-linux|libpulse|libX11|libudev|libdbus' "${GITHUB_WORKSPACE}/android-native-dependencies.txt"; then
            echo "Desktop GNU/Linux dependency detected in Android binary"
            exit 1
          fi

      - name: Build Fabric mod with Android WebRTC
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Verify packaged Android WebRTC
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          unzip -l "$JAR" | tee packaged-files.txt
          grep -q 'webrtc-java-0.14.0-linux-aarch64.jar' packaged-files.txt

      - name: Upload native port and mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: lucy-android-fcl-native-webrtc
          path: |
            build/libs/*.jar
            ${{ runner.temp }}/webrtc-java/webrtc-jni/target/webrtc-java-0.14.0-linux-aarch64.jar
            android-native-dependencies.txt
          if-no-files-found: error
